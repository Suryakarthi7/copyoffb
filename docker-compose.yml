services:
  # ----------------------------------------------------
  # 1. DATABASE CONTAINER (PostgreSQL) - Internal Only
  # ----------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: copyoffb-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password  # 👈 No plaintext password!
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 2. BACKEND CONTAINER (Node.js API) - Gateway
  # ----------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: copyoffb-backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_NAME=postgres
      - DB_PORT=5432
      - DB_PASSWORD_FILE=/run/secrets/db_password      # 👈 Secret file path
      - PORT=5000
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend-network
      - internal-network

  # ----------------------------------------------------
  # 3. FRONTEND CONTAINER (Nginx) - User-Defined Standard
  # ----------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: copyoffb-frontend
    restart: always
    ports:
      - "8085:80"
    depends_on:
      - backend
    networks:
      - frontend-network

# ----------------------------------------------------
# DOCKER SECRETS DEFINITION
# ----------------------------------------------------
secrets:
  db_password:
    file: ./secrets/db_password.txt

# ----------------------------------------------------
# NETWORKS CONFIGURATION
# ----------------------------------------------------
networks:
  # Standard User-Defined Bridge Network (Frontend <-> Backend)
  frontend-network:
    driver: bridge

  # Internal User-Defined Bridge Network (Backend <-> Database only, isolated)
  internal-network:
    driver: bridge
    internal: true

# ----------------------------------------------------
# VOLUMES (Data Persistence for PostgreSQL)
# ----------------------------------------------------
volumes:
  pgdata:
